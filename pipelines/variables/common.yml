# =============================================================================
# Pipeline variables
# =============================================================================

variables:

  - name: ciPoolName
    value: "Azure Pipelines"

  - name: privatePoolName
    value: "private-selfhosted-linux"

  - name: terraformVersion
    value: "1.9.5"
  - name: helmVersion
    value: "3.16.2"
  - name: kubectlVersion
    value: "1.30.5"

  - name: infraRoot
    value: "infra/terraform"
  - name: chartPath
    value: "charts/banking-application"
  - name: appPath
    value: "application"
  - name: imageRepository
    value: "banking-application"

  - name: imageTag
    value: "$(Build.BuildNumber)-$(Build.SourceVersion)"

  - name: tfStateResourceGroup
    value: "rg-${var.environment}-${var.name_prefix}"
  - name: tfStateStorageAccount
    value: "sa${var.environment}01"
  - name: tfStateContainer
    value: "tfstate"

  - name: nonProdServiceConnection
    value: "subscription-non-prod"
  - name: prodServiceConnection
    value: "subscription-prod"

  - name: nonProdSubscriptionId
    value: "nonprod_sub_id"
  - name: prodSubscriptionId
    value: "prod_sub_id"

  - name: nonProdAcrName
    value: "acrnonprod"
  - name: prodAcrName
    value: "acrnonprod"

  - name: appNamespace
    value: "banking-application"
  - name: helmRelease
    value: "banking-application"

  - name: securitySeverityThreshold
    value: "HIGH,CRITICAL"
