# =============================================================================
# Pipeline variables
# =============================================================================

# SHARED PIPELINE VARIABLES. Note what is NOT here: no secrets, no connection strings,
# no keys. The service connections below authenticate with WORKLOAD IDENTITY FEDERATION,
# so there is no client secret anywhere in Azure DevOps - the OIDC token is minted per
# run and lives for minutes.
#
# Tool versions are pinned and are deliberately kept IN SYNC with the versions baked
# into the agent image by modules/pipeline-agent. That duplication is itself a smell
# (docs/02 P2-13): the pipeline should VERIFY these tools exist and fail loudly if the
# agent image has drifted, rather than reinstalling them on every run.
#
# KNOWN DEFECT (docs/02 P0-6): appNamespace is hardcoded to "banking-application" while
# infra/terraform/variables.tf defaults to "banking-api". The deploy stage correctly
# overrides it from the Terraform output app_namespace, so this value is effectively
# dead - but a dead variable that LOOKS live is dangerous. Delete it, or comment it as
# informational only.
#
# KNOWN DEFECT (docs/02 P1-7): imageTag interpolates $(Build.BuildNumber), which the
# root pipeline's "name:" field sets to a string containing SPACES - an illegal OCI tag.

variables:

  - name: ciPoolName
    value: "Azure Pipelines"

  - name: privatePoolName
    value: "private-selfhosted-linux"

  - name: terraformVersion
    value: "1.9.5"
  - name: helmVersion
    value: "3.16.2"
  - name: kubectlVersion
    value: "1.30.5"

  - name: infraRoot
    value: "infra/terraform"
  - name: chartPath
    value: "charts/banking-application"
  - name: appPath
    value: "application"
  - name: imageRepository
    value: "banking-application"

  - name: imageTag
    value: "$(Build.BuildNumber)-$(Build.SourceVersion)"

  - name: tfStateResourceGroup
    value: "rg-tfstate-iac"
  - name: tfStateStorageAccount
    value: "satfstateiac001"
  - name: tfStateContainer
    value: "tfstate"

  - name: nonProdServiceConnection
    value: "subscription-non-prod"
  - name: prodServiceConnection
    value: "subscription-prod"

  - name: nonProdSubscriptionId
    value: "nonprod_sub_id"
  - name: prodSubscriptionId
    value: "prod_sub_id"

  - name: nonProdAcrName
    value: "acrnonprod"
  - name: prodAcrName
    value: "acrprod"

  - name: appNamespace
    value: "banking-application"
  - name: helmRelease
    value: "banking-application"

  - name: securitySeverityThreshold
    value: "HIGH,CRITICAL"
