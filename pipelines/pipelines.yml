# =============================================================================
# Deployment - CI/CD Automation
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - application/**
      - charts/**
      - pipelines/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - application/**
      - charts/**
      - pipelines/**

variables:
  - template: variables/common.yml

stages:
  # ===========================================================================
  # CI - runs on every commit and every pull request
  # ===========================================================================
  - template: templates/stage-validate.yml
    parameters:
      poolName: $(ciPoolName)

  - template: templates/stage-security.yml
    parameters:
      poolName: $(ciPoolName)
      dependsOn: [Validate]

  # ===========================================================================
  # non-prod - deployed from main. gate: with peer-approval.
  # ===========================================================================
  - template: templates/stage-build-image.yml
    parameters:
      stageName: Build_Image_nonProd
      poolName: $(privatePoolNameNonProd)
      dependsOn: [Security]
      serviceConnection: $(nonProdServiceConnection)
      acrName: $(nonProdAcrName)
  
  - template: templates/stage-terraform.yml
    parameters:
      stageName: Infra_nonProd
      displayName: "non-prod - infrastructure"
      dependsOn: [BuildImage]
      environmentName: nonprod-environment
      terraformEnv: nonprod
      poolName: $(privatePoolNameNonProd)
      serviceConnection: $(nonProdServiceConnection)
      subscriptionId: $(nonProdSubscriptionId)
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - template: templates/stage-deploy.yml
    parameters:
      stageName: Deploy_nonProd
      displayName: "non-prod - Helm release and smoke tests"
      dependsOn: [Infra_nonProd]
      environmentName: nonprod-environment
      terraformEnv: nonprod
      valuesFile: values-nonprod.yaml
      poolName: $(privatePoolNameNonProd)
      serviceConnection: $(nonProdServiceConnection)
      subscriptionId: $(nonProdSubscriptionId)

  # ===========================================================================
  # Prod - deployed from main. gate: with manager/architect-approval.
  # ===========================================================================
  - template: templates/stage-build-image.yml
    parameters:
      stageName: Build_Image_Prod
      poolName: $(privatePoolNameProd)
      dependsOn: [Security]
      serviceConnection: $(ProdServiceConnection)
      acrName: $(ProdAcrName)

  - template: templates/stage-terraform.yml
    parameters:
      stageName: Infra_Prod
      displayName: "Prod - infrastructure (approval required)"
      dependsOn: [Deploy_nonProd]
      environmentName: prod-environment
      terraformEnv: prod
      poolName: $(privatePoolNameProd)
      serviceConnection: $(prodServiceConnection)
      subscriptionId: $(prodSubscriptionId)
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - template: templates/stage-deploy.yml
    parameters:
      stageName: Deploy_Prod
      displayName: "Prod - Helm release and smoke tests (approval required)"
      dependsOn: [Infra_Prod]
      environmentName: prod-environment
      terraformEnv: prod
      valuesFile: values-prod.yaml
      poolName: $(privatePoolNameProd)
      serviceConnection: $(prodServiceConnection)
      subscriptionId: $(prodSubscriptionId)
