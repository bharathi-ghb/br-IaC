# =============================================================================
# Stage template: Helm deploy and smoke tests
# =============================================================================
parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: environmentName
    type: string
  - name: terraformEnv
    type: string
  - name: valuesFile
    type: string
  - name: poolName
    type: string
  - name: serviceConnection
    type: string
  - name: subscriptionId
    type: string

# DEPLOY - connect to the private cluster, release with Helm, smoke test, roll back on
# failure.
#
# CONNECTING TO A PRIVATE CLUSTER, the two steps that matter:
#   az aks get-credentials   - an ARM call against the PUBLIC control plane, so it
#                              succeeds from anywhere.
#   kubelogin convert-kubeconfig -l azurecli - MANDATORY. Without it the kubeconfig
#                              contains a device-code flow that PROMPTS FOR INTERACTIVE
#                              LOGIN, which in a pipeline means the job HANGS silently
#                              until it times out. Very recognisable failure: no error,
#                              just a hang.
#
# It is the subsequent kubectl/helm traffic that requires private line-of-sight -
# which is why the pool must be the private self-hosted one. A Microsoft-hosted agent
# gets through get-credentials and then times out on kubectl (Scenario 4).
#
# EVERY VALUE COMES FROM TERRAFORM OUTPUTS via the outputs.env artifact: the registry,
# the workload identity client ID, the storage account, the namespace and the
# ServiceAccount name. Nothing environment-specific is hardcoded in the chart, and
# Terraform is the single source of truth for the names that must agree with the
# federated identity credential.
#
# "helm template" is run immediately before "helm upgrade" so the rendered manifest
# appears in the build log - which is what you read first during an incident.
#
# --atomic --wait --timeout 10m: a failed or timed-out release ROLLS ITSELF BACK, so a
# bad deploy never leaves a half-applied state.
#
# KNOWN DEFECT (docs/02 P1-14): --atomic ALREADY rolls back, and the failure step below
# ALSO calls helm-rollback.sh, which does "helm rollback <rel> 0" (= previous). If
# --atomic already rolled back, this rolls back AGAIN - potentially two revisions, in
# production, automatically. Make the script idempotent: compare the current revision
# against the last one with status "deployed" and do nothing if they match.
#
# WHAT THE FAILURE STEP GETS RIGHT, and is worth keeping: it captures pod state,
# deployment description, container logs and recent events BEFORE rolling back. The
# moment you roll back, the broken pods are gone and so is your ability to explain what
# happened. That is the step people skip and then regret in the post-mortem.
#
# KNOWN DEFECT (docs/02 P2-3): the telemetry Secret step materialises the App Insights
# connection string as a Kubernetes Secret. With local_authentication_enabled = false on
# App Insights, the ingestion key in that string is INERT - so this is treating a
# non-secret as a secret. The app should authenticate telemetry with the same Workload
# Identity and read the endpoint from the ConfigMap. If a real secret is ever needed, use
# the Key Vault CSI driver (already enabled on the cluster) so it never transits the
# pipeline at all.

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    jobs:
      - deployment: HelmDeploy
        displayName: "helm upgrade --install and smoke tests"
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.poolName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: $(helmVersion)

                - task: KubectlInstaller@0
                  inputs:
                    kubectlVersion: $(kubectlVersion)

                - download: current
                  artifact: "tfout-${{ parameters.terraformEnv }}"
                  displayName: "Download Terraform outputs"

                - task: AzureCLI@2
                  displayName: "Connect to the private AKS cluster"
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      set -a
                      source "$(Pipeline.Workspace)/tfout-${{ parameters.terraformEnv }}/outputs.env"
                      set +a

                      echo "Cluster: ${aks_cluster_name} (resource group ${resource_group_name})"

                      az aks get-credentials \
                        --resource-group "${resource_group_name}" \
                        --name "${aks_cluster_name}" \
                        --overwrite-existing

                      az aks install-cli --only-show-errors 2>/dev/null || true
                      kubelogin convert-kubeconfig -l azurecli

                      kubectl cluster-info
                      kubectl get nodes -o wide

                      echo "##vso[task.setvariable variable=aksClusterName]${aks_cluster_name}"
                      echo "##vso[task.setvariable variable=resourceGroupName]${resource_group_name}"
                      echo "##vso[task.setvariable variable=acrLoginServer]${acr_login_server}"
                      echo "##vso[task.setvariable variable=workloadClientId]${workload_identity_client_id}"
                      echo "##vso[task.setvariable variable=storageAccountName]${storage_account_name}"
                      echo "##vso[task.setvariable variable=cacheContainerName]${cache_container_name}"
                      echo "##vso[task.setvariable variable=targetNamespace]${app_namespace}"
                      echo "##vso[task.setvariable variable=serviceAccountName]${app_service_account_name}"

                # -------------------------------------------------------------
                - task: AzureCLI@2
                  displayName: "Create the telemetry Secret"
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      TF_DIR="$(infraRoot)/environments/${{ parameters.terraformEnv }}"

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID="${servicePrincipalId}"
                      export ARM_OIDC_TOKEN="${idToken}"
                      export ARM_TENANT_ID="${tenantId}"
                      export ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
                      export TF_VAR_subscription_id="${{ parameters.subscriptionId }}"

                      terraform -chdir="${TF_DIR}" init -input=false -no-color \
                        -backend-config="${TF_DIR}/azurerm.tfbackend" >/dev/null

                      kubectl create namespace "$(targetNamespace)" \
                        --dry-run=client -o yaml | kubectl apply -f -

                      CONNECTION_STRING="$(terraform -chdir="${TF_DIR}" output -raw app_insights_connection_string)"

                      kubectl create secret generic banking-application-telemetry \
                        --namespace "$(targetNamespace)" \
                        --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING="${CONNECTION_STRING}" \
                        --dry-run=client -o yaml | kubectl apply -f -

                      echo "Telemetry secret applied (value redacted)."

                # -------------------------------------------------------------
                - task: AzureCLI@2
                  displayName: "helm upgrade --install"
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      helm template "$(helmRelease)" "$(chartPath)" \
                        --namespace "$(targetNamespace)" \
                        --values "$(chartPath)/${{ parameters.valuesFile }}" \
                        --set image.registry="$(acrLoginServer)" \
                        --set image.tag="$(imageTag)" \
                        --set workloadIdentity.clientId="$(workloadClientId)" \
                        --set config.storageAccountName="$(storageAccountName)" \
                        --set config.cacheContainer="$(cacheContainerName)" \
                        --set serviceAccount.name="$(serviceAccountName)"

                      helm upgrade --install "$(helmRelease)" "$(chartPath)" \
                        --namespace "$(targetNamespace)" \
                        --values "$(chartPath)/${{ parameters.valuesFile }}" \
                        --set image.registry="$(acrLoginServer)" \
                        --set image.tag="$(imageTag)" \
                        --set workloadIdentity.clientId="$(workloadClientId)" \
                        --set config.storageAccountName="$(storageAccountName)" \
                        --set config.cacheContainer="$(cacheContainerName)" \
                        --set serviceAccount.name="$(serviceAccountName)" \
                        --atomic \
                        --wait \
                        --timeout 10m \
                        --description "Build $(Build.BuildNumber) / commit $(Build.SourceVersion)"

                      helm history "$(helmRelease)" --namespace "$(targetNamespace)" --max 5

                # -------------------------------------------------------------
                - task: AzureCLI@2
                  displayName: "Smoke tests - GET /api/shows and Azure integrations"
                  name: smoke
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      chmod +x scripts/smoke-test.sh
                      ./scripts/smoke-test.sh \
                        "$(targetNamespace)" \
                        "$(helmRelease)" \
                        "$(storageAccountName)" \
                        "$(cacheContainerName)"

                # -------------------------------------------------------------
                - task: AzureCLI@2
                  displayName: "Roll back on smoke test failure"
                  condition: failed()
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      echo "##vso[task.logissue type=error]Smoke tests failed - rolling back the Helm release"

                      echo "=== Diagnostics captured before rollback ==="
                      kubectl -n "$(targetNamespace)" get pods -o wide || true
                      kubectl -n "$(targetNamespace)" describe deployment "$(helmRelease)" || true
                      kubectl -n "$(targetNamespace)" logs -l "app.kubernetes.io/instance=$(helmRelease)" \
                        --tail=100 --all-containers || true
                      kubectl -n "$(targetNamespace)" get events --sort-by=.lastTimestamp | tail -40 || true

                      chmod +x scripts/helm-rollback.sh
                      ./scripts/helm-rollback.sh "$(targetNamespace)" "$(helmRelease)"

                - script: |
                    kubectl -n "$(targetNamespace)" get all -l "app.kubernetes.io/instance=$(helmRelease)" || true
                  displayName: "Final release state"
                  condition: always()
