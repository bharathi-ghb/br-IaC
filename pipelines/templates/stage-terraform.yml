# =============================================================================
# Stage template: Terraform plan and apply
# =============================================================================
parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: environmentName
    type: string
  - name: terraformEnv
    type: string
  - name: poolName
    type: string
  - name: serviceConnection
    type: string
  - name: subscriptionId
    type: string
  - name: condition
    type: string
    default: succeeded()

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: Plan
        displayName: "terraform plan (${{ parameters.terraformEnv }})"
        pool:
          name: ${{ parameters.poolName }}
        steps:
          - checkout: self
            fetchDepth: 1

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: "terraform init and plan"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                TF_DIR="$(infraRoot)/environments/${{ parameters.terraformEnv }}"

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID="${servicePrincipalId}"
                export ARM_OIDC_TOKEN="${idToken}"
                export ARM_TENANT_ID="${tenantId}"
                export ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
                export TF_VAR_subscription_id="${{ parameters.subscriptionId }}"

                terraform -chdir="${TF_DIR}" init -input=false -no-color \
                  -backend-config="${TF_DIR}/azurerm.tfbackend"

                set +e
                terraform -chdir="${TF_DIR}" plan -input=false -no-color -lock-timeout=5m \
                  -detailed-exitcode -out=tfplan.binary
                PLAN_EXIT=$?
                set -e

                if [[ $PLAN_EXIT -eq 1 ]]; then
                  echo "##vso[task.logissue type=error]terraform plan failed"
                  exit 1
                fi

                echo "##vso[task.setvariable variable=planExitCode;isOutput=true]${PLAN_EXIT}"

                terraform -chdir="${TF_DIR}" show -no-color tfplan.binary > "${TF_DIR}/tfplan.txt"
                terraform -chdir="${TF_DIR}" show -json tfplan.binary > "${TF_DIR}/tfplan.json"

                echo "===================== PLAN SUMMARY ====================="
                grep -E '^(Plan:|No changes)' "${TF_DIR}/tfplan.txt" || true
                echo "========================================================"
            name: plan

          - publish: "$(infraRoot)/environments/${{ parameters.terraformEnv }}/tfplan.binary"
            artifact: "tfplan-${{ parameters.terraformEnv }}"
            displayName: "Publish plan file"

          - publish: "$(infraRoot)/environments/${{ parameters.terraformEnv }}/tfplan.txt"
            artifact: "tfplan-readable-${{ parameters.terraformEnv }}"
            displayName: "Publish readable plan"

      - deployment: Apply
        displayName: "terraform apply (${{ parameters.terraformEnv }})"
        dependsOn: Plan
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.poolName }}
        variables:
          planExitCode: $[ dependencies.Plan.outputs['plan.planExitCode'] ]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  artifact: "tfplan-${{ parameters.terraformEnv }}"
                  displayName: "Download approved plan"

                - task: AzureCLI@2
                  displayName: "terraform apply (approved plan only)"
                  condition: eq(variables.planExitCode, '2')
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      TF_DIR="$(infraRoot)/environments/${{ parameters.terraformEnv }}"

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID="${servicePrincipalId}"
                      export ARM_OIDC_TOKEN="${idToken}"
                      export ARM_TENANT_ID="${tenantId}"
                      export ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
                      export TF_VAR_subscription_id="${{ parameters.subscriptionId }}"

                      terraform -chdir="${TF_DIR}" init -input=false -no-color \
                        -backend-config="${TF_DIR}/azurerm.tfbackend"

                      cp "$(Pipeline.Workspace)/tfplan-${{ parameters.terraformEnv }}/tfplan.binary" \
                         "${TF_DIR}/tfplan.binary"

                      terraform -chdir="${TF_DIR}" apply -input=false -no-color -lock-timeout=5m \
                        -auto-approve tfplan.binary

                - script: echo "No infrastructure changes in this plan - apply skipped."
                  displayName: "No changes to apply"
                  condition: ne(variables.planExitCode, '2')

                - task: AzureCLI@2
                  displayName: "Export Terraform outputs for the deploy stage"
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      TF_DIR="$(infraRoot)/environments/${{ parameters.terraformEnv }}"

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID="${servicePrincipalId}"
                      export ARM_OIDC_TOKEN="${idToken}"
                      export ARM_TENANT_ID="${tenantId}"
                      export ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
                      export TF_VAR_subscription_id="${{ parameters.subscriptionId }}"

                      terraform -chdir="${TF_DIR}" init -input=false -no-color \
                        -backend-config="${TF_DIR}/azurerm.tfbackend"

                      mkdir -p "$(Build.ArtifactStagingDirectory)/tfout"

                      for output in aks_cluster_name resource_group_name acr_name acr_login_server \
                                    workload_identity_client_id storage_account_name \
                                    cache_container_name app_namespace app_service_account_name; do
                        value="$(terraform -chdir="${TF_DIR}" output -raw "${output}")"
                        echo "${output}=${value}" >> "$(Build.ArtifactStagingDirectory)/tfout/outputs.env"
                      done

                      cat "$(Build.ArtifactStagingDirectory)/tfout/outputs.env"

                - publish: "$(Build.ArtifactStagingDirectory)/tfout"
                  artifact: "tfout-${{ parameters.terraformEnv }}"
                  displayName: "Publish Terraform outputs"
