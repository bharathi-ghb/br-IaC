# =============================================================================
# Development overlay
# =============================================================================

replicaCount: 1

config:
  logLevel: debug
  cacheTtlSeconds: 60

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

topologySpreadEnabled: false

commonLabels:
  environment: non-prod
