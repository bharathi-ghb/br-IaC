{{/*
=============================================================================
DEPLOYMENT - the release strategy and pod hardening decisions live here.

STRATEGY: maxUnavailable: 0 / maxSurge: 1
  Never take capacity away during a rollout - add one pod, verify it, then remove
  one. The trade-off is a slower rollout and the need for headroom for +1 pod.
  This is what makes a bad release visible WITHOUT customer impact: the new pod
  fails readiness, the old ones keep serving, and helm --atomic rolls back.

checksum/config ANNOTATION (below)
  Kubernetes does NOT restart pods when a ConfigMap changes - it updates the
  ConfigMap and the pods keep serving the OLD values until something else restarts
  them. That is silent, extremely confusing config drift. Hashing the rendered
  ConfigMap into a pod-template annotation makes any config change produce a new
  pod spec and therefore a rolling restart.
  Cost: every trivial config change causes a rollout.

azure.workload.identity/use LABEL
  MUST be on the POD TEMPLATE (spec.template.metadata.labels), not on the
  Deployment's own labels. That is what the azure-wi-webhook selects on. Put it in
  the wrong place and no env vars and no token volume are injected, and the Azure
  SDK silently falls through its credential chain to a confusing failure minutes
  later. This is one of the most common Workload Identity mistakes.

SECURITY CONTEXT (from values.yaml)
  runAsNonRoot + runAsUser 65532 + drop ALL + seccomp RuntimeDefault +
  readOnlyRootFilesystem = full Pod Security Standards "restricted" compliance.
  readOnlyRootFilesystem requires the emptyDir on /tmp below; sizeLimit: 64Mi stops
  an emptyDir filling the node's disk.
  NOTE: 65532 must match the Dockerfile's USER directive or the container fails to
  start with a permission error.

topologySpreadConstraints with ScheduleAnyway
  PREFERS an even spread across zones but degrades placement rather than blocking
  scheduling during a zone outage. DoNotSchedule would be stricter but would leave
  pods Pending when a zone is unavailable - trading availability for balance, which
  is the wrong trade here.
=============================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "banking-application.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banking-application.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity away during a rollout; add one, then remove one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "banking-application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "banking-application.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.workloadIdentity.enabled }}   
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "banking-application.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "banking-application.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "banking-application.fullname" . }}-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.secret.existingSecret }}
            
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.connectionStringKey }}
                  optional: true
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:

            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- if .Values.topologySpreadEnabled }}
      topologySpreadConstraints:
        # Spread replicas across zones. ScheduleAnyway rather than DoNotSchedule
        # so a zone outage degrades placement instead of blocking it entirely.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "banking-application.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
