{{/*
=============================================================================
SERVICEACCOUNT - the Kubernetes half of the Workload Identity trust.

THE ANNOTATION azure.workload.identity/client-id
  Tells the webhook which managed identity to inject as AZURE_CLIENT_ID. A wrong or
  missing value gives AADSTS700016 ("application not found in the directory").

THE NAME MATTERS MORE THAN ANYTHING ELSE HERE
  The federated identity credential in Azure has subject
  "system:serviceaccount:<namespace>:<this name>", compared by Entra as an EXACT
  string. A mismatch gives AADSTS70021 - and the failure is silent until the pod's
  first Azure call. See docs/02 P0-6: this chart's default name currently disagrees
  with the Terraform default.

automountServiceAccountToken: false
  This does NOT break Workload Identity, and knowing why is a good test of whether
  someone understands the mechanism. The azure-wi-webhook injects its OWN projected
  volume (azure-identity-token, audience api://AzureADTokenExchange) independently
  of the default token automount. Turning the default token off means the pod cannot
  call the Kubernetes API AT ALL - so a compromised container cannot enumerate
  secrets or other pods. Pure hardening win with no cost to this workload.

validateValues (called above)
  Fails the RENDER if workloadIdentity is enabled without a clientId. Turning a
  runtime auth failure into a deploy-time template error is the pattern to extend -
  see the note in values.yaml about also asserting the subject.
=============================================================================
*/}}
{{- include "banking-application.validateValues" . -}}
{{- if .Values.serviceAccount.create }}
# =============================================================================
# ServiceAccount
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "banking-application.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "banking-application.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
